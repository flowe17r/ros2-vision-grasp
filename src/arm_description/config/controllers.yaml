controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
      joint1: {goal: 0.05, trajectory: 0.2}
      joint2: {goal: 0.05, trajectory: 0.2}
      joint3: {goal: 0.05, trajectory: 0.2}
      joint4: {goal: 0.05, trajectory: 0.2}
      joint5: {goal: 0.05, trajectory: 0.2}
      joint6: {goal: 0.05, trajectory: 0.2}

gripper_controller:
  ros__parameters:
    joints:
      - finger_left_joint
      - finger_right_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 3.0
      # 夹到方块时指关节会被挡住约 1-2 mm，给足 goal 容差避免动作被判失败
      finger_left_joint: {goal: 0.02, trajectory: 0.05}
      finger_right_joint: {goal: 0.02, trajectory: 0.05}
