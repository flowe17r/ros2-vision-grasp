name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ros:jazzy
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          retry() {
            local attempt output=/tmp/retry.log
            for attempt in 1 2 3; do
              if "$@" >"$output" 2>&1; then
                return 0
              fi
              echo "attempt ${attempt}/3 failed: $*" >&2
              sleep $((attempt * 15))
            done
            tail -n 30 "$output" >&2
            echo "::error::$* failed: $(tail -n 5 "$output" | tr '\n' ' ' | cut -c1-600)" >&2
            return 1
          }
          retry apt-get update
          retry apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            ros-jazzy-ros-gz ros-jazzy-cv-bridge python3-opencv \
            ros-jazzy-ament-cmake-gtest
          retry rosdep update --rosdistro jazzy
          retry rosdep install --from-paths src --ignore-src -y --rosdistro jazzy

      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --event-handlers console_direct+

      - name: Test
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          set +e
          colcon test --packages-select arm_serial --event-handlers console_direct+
          test_rc=$?
          result=$(colcon test-result --verbose --all 2>&1)
          result_rc=$?
          printf '%s\n' "$result"
          if [ "$test_rc" -ne 0 ] || [ "$result_rc" -ne 0 ]; then
            summary=$(printf '%s' "$result" | tail -n 25 | tr '\n' ' ' | cut -c1-900)
            echo "::error::colcon test rc=$test_rc, test-result rc=$result_rc: $summary"
            exit 1
          fi
